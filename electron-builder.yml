appId: com.btviewer.app
productName: BTViewer
directories:
  buildResources: build
  output: release
# 只打包构建产物：主进程依赖已在 electron-vite 里内联（见 externalizeDepsPlugin 的 exclude），
# 因此不需要把 node_modules 一起分发
files:
  - release/app/**/*
# aria2 按「平台-架构」分目录（resources/aria2/<win|mac|linux>-<x64|arm64>/），
# 每个平台只带自己那份，避免 mac 包里塞进 Windows 的 exe、或把 Linux ELF 当 mac 二进制。
# ${os} 与 electron-builder 的归档标识一致：win / mac（含 mac-arm64 等后缀由 ${arch} 区分）。
extraResources:
  - from: resources/aria2/${os}-${arch}
    to: aria2/${os}-${arch}
    filter:
      - "**/*"
  # 内置媒体工具（ffmpeg/ffprobe）同样按平台-架构分目录；缺失时应用会自动走在线安装/系统 PATH
  - from: resources/media/${os}-${arch}
    to: media/${os}-${arch}
    filter:
      - "**/*"
  # AI 运行时（MediaPipe / ONNX Runtime 的 WASM）：由 ai:// 协议加载，随包分发以保证离线可用；识别模型按需下载，不打包
  - from: node_modules/@mediapipe/tasks-vision/wasm
    to: runtime/mediapipe
    filter:
      - "**/*"
  - from: node_modules/onnxruntime-web/dist
    to: runtime/ort
    filter:
      - "ort-wasm-simd-threaded.wasm"
      - "ort-wasm-simd-threaded.mjs"
  - from: resources/icon.png
    to: icon.png
# 文件关联与协议注册在安装期完成（比运行期写注册表可靠）：
# 双击 .torrent/.metalink 打开应用，点网页磁力链接唤起应用（应用内用单实例把输入转给已运行实例）
# 不给 fileAssociation 单独指定 icon：icon.ico 与应用图标是同一个文件，mac 上会被转成 icon.icns
# 与 applyCommonInfo 先写入的主图标重名，electron-builder 硬链接时抛 EEXIST（打包直接失败）。
# 不指定时 Windows 关联图标自动回退到应用 exe，行为不变。
fileAssociations:
  - ext: torrent
    name: BitTorrent 种子文件
    description: BTViewer 种子文件
    role: Viewer
  - ext: metalink
    name: Metalink 下载描述文件
    description: BTViewer Metalink 文件
    role: Viewer
protocols:
  - name: Magnet Link
    schemes:
      - magnet
# 打 tag 后由 CI 用 `electron-builder --publish always` 上传到 GitHub Release
publish:
  provider: github
  owner: dsjerry
  repo: btviewer
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  # 安装向导而非静默安装：与文件关联/协议注册配合，用户可改安装目录
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BTViewer
# DMG 安装窗口（顶层键，不属于 mac 段）：深色品牌背景
# （scripts/generate-dmg-background.mjs 生成，Retina @2x 同目录自动取用）。
# 不自定义 contents：默认落点即 660×400 窗口的标准布局（应用 130,220 / Applications 410,220），
# 自定义 contents 的 file path 在打包后解析不到 .app（CI 已踩坑），背景辉光对准默认落点即可
dmg:
  background: resources/dmg/background.png
  window:
    width: 660
    height: 400

mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  category: public.app-category.utilities
  # universal 包必须同时保留 resources/aria2/mac-x64 与 mac-arm64 两份 aria2：
  # universal 运行时 process.arch 是当前真实架构，resolveAria2Binary 会按它选目录。
  # 签名与公证都从环境变量取，缺省时自动降级（CI 未配 secrets 也能出可测试的包）：
  #   CSC_LINK / CSC_KEY_PASSWORD → Developer ID 证书；CSC_IDENTITY_AUTO_DISCOVERY=false 显式关闭签名
  #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID → notarize（已开启，缺凭据时 electron-builder 跳过）
  # 不写死 identity，让 builder 按 CSC_LINK 自动识别证书名；未签名/未公证的包 Gatekeeper 会拦，
  # 且 macOS 10.13+ 的开机自启（SMAppService）也要求已签名并位于 /Applications。
  hardenedRuntime: true
  # 摄像头权限（手势控制）：渲染进程是子进程，授权需同时写入 entitlements 与 entitlementsInherit
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  notarize: true
  extendInfo:
    NSCameraUsageDescription: BTViewer 仅在播放页开启手势控制时使用摄像头识别手势，画面只在本机处理，不会上传。
    # 与 win 的 AppUserModelID / 协议注册保持一致
    CFBundleURLTypes:
      - CFBundleURLName: Magnet Link
        CFBundleURLSchemes:
          - magnet
    # 视频音频文件关联：macOS「打开方式」列表依据 CFBundleDocumentTypes（LSHandlerRank=Default
    # 才会作为候选 app 列出）。mkv/webm/wmv/flv/ogg/flac 系统没有内置 UTI，必须先在
    # UTImportedTypeDeclarations 导入类型、再用 LSItemContentTypes 引用，只写扩展名在「打开方式」里不可靠。
    # 声明在打包期写入 Info.plist：只有重新打包安装后才可见（开发态 electron.app 不带本声明）；
    # 装好后 LaunchServices 若仍不刷新，执行
    #   /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f <app路径>
    CFBundleDocumentTypes:
      - name: Video Media
        CFBundleTypeName: 视频文件
        CFBundleTypeRole: Viewer
        LSHandlerRank: Default
        LSItemContentTypes:
          - public.mpeg-4
          - com.apple.m4v-video
          - com.apple.quicktime-movie
          - public.avi
          - public.mpeg
          - public.mpeg-2-transport-stream
          - org.matroska.mkv
          - org.webmproject.webm
          - com.microsoft.windows-media-wmv
          - com.adobe.flash-video
        CFBundleTypeExtensions:
          - mp4
          - m4v
          - mkv
          - avi
          - mov
          - webm
          - mpg
          - mpeg
          - m2ts
          - ts
          - wmv
          - flv
          - rmvb
      - name: Audio Media
        CFBundleTypeName: 音频文件
        CFBundleTypeRole: Viewer
        LSHandlerRank: Default
        LSItemContentTypes:
          - public.mp3
          - public.mpeg-4-audio
          - com.microsoft.waveform-audio
          - org.xiph.flac
          - org.xiph.ogg
        CFBundleTypeExtensions:
          - mp3
          - m4a
          - flac
          - wav
          - aac
          - ogg
          - wma
    # 系统未内置的容器类型：导入声明让 LaunchServices 认识这些 UTI（org.* 逆向域名为社区通行约定）
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: org.matroska.mkv
        UTTypeDescription: Matroska Video
        UTTypeConformsTo:
          - public.movie
        UTTypeTagSpecification:
          public.filename-extension:
            - mkv
      - UTTypeIdentifier: org.webmproject.webm
        UTTypeDescription: WebM Video
        UTTypeConformsTo:
          - public.movie
        UTTypeTagSpecification:
          public.filename-extension:
            - webm
      - UTTypeIdentifier: com.microsoft.windows-media-wmv
        UTTypeDescription: Windows Media Video
        UTTypeConformsTo:
          - public.movie
        UTTypeTagSpecification:
          public.filename-extension:
            - wmv
      - UTTypeIdentifier: com.adobe.flash-video
        UTTypeDescription: Flash Video
        UTTypeConformsTo:
          - public.movie
        UTTypeTagSpecification:
          public.filename-extension:
            - flv
      - UTTypeIdentifier: org.xiph.ogg
        UTTypeDescription: Ogg Audio
        UTTypeConformsTo:
          - public.audio
        UTTypeTagSpecification:
          public.filename-extension:
            - ogg
      - UTTypeIdentifier: org.xiph.flac
        UTTypeDescription: FLAC Audio
        UTTypeConformsTo:
          - public.audio
        UTTypeTagSpecification:
          public.filename-extension:
            - flac
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Network
