appId: com.btviewer.app
productName: BTViewer
directories:
  buildResources: build
  output: release
files:
  - release/app/**/*
extraResources:
  - from: resources/aria2
    to: aria2
  - from: resources/icon.png
    to: icon.png
win:
  target: nsis
  icon: resources/icon.ico
mac:
  target: dmg
  icon: resources/icon.icns
linux:
  target: AppImage
  icon: resources/icon.png
