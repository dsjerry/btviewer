name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 端到端冒烟（D1）：启动真实应用 + 本地文件服务，验证「添加任务 → 真实下载 → 界面显示已完成」
      # 只在 Windows 上跑：Linux 起 Electron 需要 xvfb
      - if: runner.os == 'Windows'
        run: npm run smoke
