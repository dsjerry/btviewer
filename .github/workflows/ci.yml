name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      # mac 也要跑：平台分支（二进制解析、登录项、菜单）只有对应 runner 才覆盖得到
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 内置原生产物是二进制：确认检出后仍可执行（防止权限位丢失或误加 LFS/换行转换）
      - name: 校验内置二进制（macOS）
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          runner_major=$(sw_vers -productVersion | cut -d. -f1)
          for bin in resources/aria2/mac-arm64/aria2c resources/media/mac-arm64/ffmpeg resources/media/mac-arm64/ffprobe; do
            test -x "$bin" || { echo "::error::$bin 不可执行"; exit 1; }
            lipo -archs "$bin" | grep -q arm64 || { echo "::error::$bin 架构不符"; exit 1; }
            # 部署目标(minos)高于 runner 系统版本的二进制在旧系统上 dyld 加载即中止（如新 SDK 默认目标引入的 _pipe2）
            minos=$(vtool -show "$bin" | sed -n 's/.*minos \([0-9]*\).*/\1/p' | head -1)
            [ "$minos" -le "$runner_major" ] || { echo "::error::$bin 部署目标(minos) $minos 高于 runner 的 macOS $runner_major；请以 MACOSX_DEPLOYMENT_TARGET=11.0 重建"; exit 1; }
            "$(dirname "$bin")/$(basename "$bin")" $([ "$(basename "$bin")" = aria2c ] && echo --version || echo -hide_banner -version) | head -1
          done

  # 端到端冒烟（D1）：启动真实应用 + 本地文件服务，走 CDP 验证「添加任务 → 真实下载 → 界面显示已完成」
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 冒烟脚本用内置 WebSocket 连 CDP，该全局对象从 Node 22 起才默认可用（Node 20 需 --experimental-websocket）
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
