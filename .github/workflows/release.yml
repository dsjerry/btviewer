name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（示例：v1.2.3 或 1.2.3）'
        required: true
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    # 三个平台并行出包。macOS 只出 Apple 芯片（arm64）包：仓库只内置了 mac-arm64 的 aria2/ffmpeg，
    # 出 universal 会缺 mac-x64 那份，Intel 机器上会启动即失败。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-14
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    # 签名/公证凭据当 secrets 注入：没配时 electron-builder 自动跳过，包照样产出（用户需手动放行）
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 没有签名证书时显式关掉自动发现，避免 electron-builder 在 mac 上尝试签名并报错
      - name: 关闭签名自动发现（未配置证书时）
        if: ${{ env.CSC_LINK == '' }}
        shell: bash
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - name: 校验内置二进制架构（macOS）
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          runner_major=$(sw_vers -productVersion | cut -d. -f1)
          for bin in resources/aria2/mac-arm64/aria2c resources/media/mac-arm64/ffmpeg resources/media/mac-arm64/ffprobe; do
            file "$bin"
            lipo -archs "$bin" | grep -q arm64 || { echo "::error::$bin 不是 arm64"; exit 1; }
            test -x "$bin" || { echo "::error::$bin 缺少执行权限"; exit 1; }
            # 部署目标(minos)高于 runner 系统版本的二进制在旧系统上 dyld 加载即中止（如新 SDK 默认目标引入的 _pipe2）
            minos=$(vtool -show "$bin" | sed -n 's/.*minos \([0-9]*\).*/\1/p' | head -1)
            [ "$minos" -le "$runner_major" ] || { echo "::error::$bin 部署目标(minos) $minos 高于 runner 的 macOS $runner_major；请以 MACOSX_DEPLOYMENT_TARGET=11.0 重建"; exit 1; }
          done
      - name: 设置版本号
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)*$ ]]; then
            echo "无效的版本号：$RELEASE_VERSION（示例：v1.2.3 或 1.2.3）"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci
      # 打开发包前先跑类型检查 / lint / 单测，避免把坏版本发出去
      - run: npm run verify
      - run: npm run build
      - name: 打包（产物稍后统一发布到 Release）
        run: npx electron-builder ${{ matrix.args }} --publish never
      # 没有 Developer ID 证书时的兜底：对整个 .app 做 ad-hoc 签名。
      # 剥掉未签名的 arm64 二进制后，macOS 会报「已损坏，无法打开」；ad-hoc 能把这类误报降成一次
      # 「无法验证开发者」的右键放行。dmg/zip 已经封好，所以这里只改归档里的 .app 并不现实——
      # 因此先删掉已生成的归档，签完再用 `--prepackaged` 重新封一次。
      - name: ad-hoc 签名（未配置 Developer ID 时）
        if: startsWith(matrix.os, 'macos') && env.CSC_LINK == ''
        shell: bash
        run: |
          APP=$(find release -maxdepth 3 -name '*.app' -type d | head -1)
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          # 内置二进制先各自签（--deep 对 hardened runtime 的嵌套可执行文件不可靠）
          find "$APP/Contents/Resources/aria2" "$APP/Contents/Resources/media" -type f -perm +111 2>/dev/null \
            | while read -r bin; do codesign --force -s - "$bin"; done
          codesign --force --deep -s - --options runtime "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "flags|Identifier"
          # 用签名后的 .app 重新生成 dmg/zip（旧归档先删，否则会被当成已存在而跳过）
          rm -f release/*.dmg release/*.zip release/*.blockmap release/latest*.yml
          npx electron-builder --mac --arm64 --prepackaged "$APP" \
            --config.mac.identity=null --publish never
          ls -la release/*.dmg release/*.zip

      # 打包后自检：mac 包内的 aria2/ffmpeg 必须真的在，且能执行（防止资源目录放错导致「装完不能用」）
      - name: 校验打包产物内的原生依赖（macOS）
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          APP=$(find release -maxdepth 3 -name '*.app' -type d | head -1)
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          R="$APP/Contents/Resources"
          for bin in "$R/aria2/mac-arm64/aria2c" "$R/media/mac-arm64/ffmpeg" "$R/media/mac-arm64/ffprobe"; do
            test -f "$bin" || { echo "::error::包内缺少 $bin"; exit 1; }
          done
          # ffmpeg/ffprobe 用 -version（没有 --version），aria2c 用 --version
          "$R/aria2/mac-arm64/aria2c" --version | head -1
          "$R/media/mac-arm64/ffmpeg" -hide_banner -version | head -1
          "$R/media/mac-arm64/ffprobe" -hide_banner -version | head -1
          # 签名必须能通过静态校验：Developer ID（已配置证书）或 ad-hoc（上面的兜底步骤）都应通过；
          # 都没通过说明 app 完全未签名，用户会看到「已损坏」
          if codesign -dv "$APP" 2>&1 | grep -q "Developer ID Application"; then
            codesign --verify --deep --strict "$APP"
            echo "Developer ID 签名校验通过"
          elif codesign -dv "$APP" 2>&1 | grep -q "adhoc"; then
            codesign --verify --deep --strict "$APP"
            echo "::warning::ad-hoc 签名（无 Developer ID 证书）：用户首次打开需右键 → 打开，开机自启不可用"
          else
            echo "::error::应用未签名，macOS 会提示「已损坏，无法打开」"
            exit 1
          fi
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          # mac 默认产出 dmg + zip（auto-update 用 zip）
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: 规范化版本号
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          TAG="${RELEASE_VERSION#v}"
          echo "tag=v${TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 下载页必须写清楚「首次打开怎么办」，否则 mac 用户看到系统提示就直接放弃了
      - name: 生成安装说明
        id: notes
        run: |
          cat > notes.md <<'EOF'
          ## 安装说明

          ### macOS（Apple 芯片）
          下载 `BTViewer-*.dmg`，把 BTViewer 拖进「应用程序」。

          本版本**未使用 Apple Developer 证书签名**，首次打开如提示「无法验证开发者」或「已损坏」：

          1. 在「应用程序」里按住 Control 点按 BTViewer → 选择「打开」→ 再点「打开」；
          2. 若仍被拦截，在终端执行一次：
             ```bash
             xattr -dr com.apple.quarantine /Applications/BTViewer.app
             ```

          > 未签名版本无法注册开机自启；需要的话请在「系统设置 → 通用 → 登录项」里手动添加。
          > 仅提供 Apple 芯片（arm64）版本，Intel Mac 请从源码构建。

          ### Windows
          运行 `BTViewer-*-win-x64.exe`。安装时如果 SmartScreen 提示「未知发布者」，点「更多信息 → 仍要运行」。

          ### Linux
          `AppImage` 直接双击运行；`deb` 用 `sudo apt install ./BTViewer-*.deb` 安装。
          EOF
          if [ -n "$GITHUB_OUTPUT" ]; then echo "path=notes.md" >> "$GITHUB_OUTPUT"; fi

      - name: 创建 GitHub Release 并附加产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
