name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（示例：v1.2.3 或 1.2.3）'
        required: true
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    # 三个平台并行出包。macOS 只出 Apple 芯片（arm64）包：仓库只内置了 mac-arm64 的 aria2/ffmpeg，
    # 出 universal 会缺 mac-x64 那份，Intel 机器上会启动即失败。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-14
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    # 签名/公证凭据当 secrets 注入：没配时 electron-builder 自动跳过，包照样产出（用户需手动放行）
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 没有签名证书时显式关掉自动发现，避免 electron-builder 在 mac 上尝试签名并报错
      - name: 关闭签名自动发现（未配置证书时）
        if: ${{ env.CSC_LINK == '' }}
        shell: bash
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - name: 校验内置二进制架构（macOS）
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          for bin in resources/aria2/mac-arm64/aria2c resources/media/mac-arm64/ffmpeg resources/media/mac-arm64/ffprobe; do
            file "$bin"
            lipo -archs "$bin" | grep -q arm64 || { echo "::error::$bin 不是 arm64"; exit 1; }
            test -x "$bin" || { echo "::error::$bin 缺少执行权限"; exit 1; }
          done
      - name: 设置版本号
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)*$ ]]; then
            echo "无效的版本号：$RELEASE_VERSION（示例：v1.2.3 或 1.2.3）"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci
      # 打开发包前先跑类型检查 / lint / 单测，避免把坏版本发出去
      - run: npm run verify
      - run: npm run build
      - name: 打包（产物稍后统一发布到 Release）
        run: npx electron-builder ${{ matrix.args }} --publish never
      # 打包后自检：mac 包内的 aria2/ffmpeg 必须真的在，且能执行（防止资源目录放错导致「装完不能用」）
      - name: 校验打包产物内的原生依赖（macOS）
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          APP=$(find release -maxdepth 3 -name '*.app' -type d | head -1)
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          R="$APP/Contents/Resources"
          for bin in "$R/aria2/mac-arm64/aria2c" "$R/media/mac-arm64/ffmpeg" "$R/media/mac-arm64/ffprobe"; do
            test -f "$bin" || { echo "::error::包内缺少 $bin"; exit 1; }
          done
          # ffmpeg/ffprobe 用 -version（没有 --version），aria2c 用 --version
          "$R/aria2/mac-arm64/aria2c" --version | head -1
          "$R/media/mac-arm64/ffmpeg" -hide_banner -version | head -1
          "$R/media/mac-arm64/ffprobe" -hide_banner -version | head -1
          # 签过名的包必须能通过静态校验
          if codesign -dv "$APP" 2>&1 | grep -q "Developer ID Application"; then
            codesign --verify --deep --strict "$APP"
            echo "签名校验通过"
          else
            echo "::warning::未签名（未配置 CSC_LINK），用户首次打开需手动放行"
          fi
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          # mac 默认产出 dmg + zip（auto-update 用 zip）
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: 规范化版本号
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          TAG="${RELEASE_VERSION#v}"
          echo "tag=v${TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 创建 GitHub Release 并附加产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: true
